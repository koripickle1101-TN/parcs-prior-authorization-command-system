name: Recruiter functional smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/recruiter-server.log 2>&1 &
          sleep 2
      - run: node tests/recruiter-functional.cjs
